# src/main/resources/application-prod.yml
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

app:
  jwt:
    secret: ${JWT_SECRET}

logging:
  level:
    root: WARN
    com.lpu.wayfinding: INFO